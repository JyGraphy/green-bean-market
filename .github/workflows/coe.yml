name: COE 옥션 결과 자동 수집

on:
  schedule:
    # 매주 월요일 오전 8시 (KST = UTC+9, 즉 UTC 전날 23:00)
    - cron: '0 23 * * 0'
  workflow_dispatch:  # 수동 실행 버튼 (옥션 발표 직후 즉시 수집할 때)

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests beautifulsoup4 lxml

      # ACE 사이트 접근이 일시적으로 막혀도 워크플로 전체가 실패로 표시되지 않게 격리.
      # 실패 시에도 부분 수집분은 커밋한다 (coe_fetch.py가 페이지별로 결과를 저장하므로).
      - name: COE 옥션 결과 수집
        id: fetch
        continue-on-error: true
        run: python scripts/coe_fetch.py

      - name: 세컨드 브레인 목차 갱신
        run: python scripts/build_wiki_index.py

      - name: 변경사항 확인
        id: check_changes
        run: |
          git add vault/raw/coe/ vault/wiki/index.md
          git diff --cached --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 변경사항 커밋 & 푸시
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GreenBeanBot"
          git config user.email "bot@green-bean-market"
          git commit -m "COE 옥션 결과 자동 수집: $(date '+%Y-%m-%d')"
          git push

      # 전 페이지 실패(사이트 구조 변경 등)면 잡을 빨간 X로 표시해 사람이 알아채게 한다.
      - name: 수집 결과 표면화
        if: always()
        run: |
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "::warning::COE 수집 스크립트가 오류를 반환했습니다 — vault/raw/coe/ 최신 보고서를 확인하세요."
            exit 1
          fi
