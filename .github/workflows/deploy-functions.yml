name: Supabase Edge Function 배포

# 로스팅 AI(analyze-roast)의 판독 프롬프트가 바뀌면 자동으로 배포한다.
# scripts/build_roast_knowledge.py 가 기기 지식을 프롬프트에 주입한 뒤,
# 그 변경이 main에 푸시되면 이 워크플로가 실서비스에 반영한다.
#
# ⚠️ 사전 준비 (한 번만): 저장소 Settings → Secrets and variables → Actions 에
#    SUPABASE_ACCESS_TOKEN 을 등록해야 한다.
#    토큰 발급: https://supabase.com/dashboard/account/tokens
#    시크릿이 없으면 이 워크플로는 아무것도 하지 않고 조용히 건너뛴다(안전).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      function_name:
        description: '배포할 함수명 (비우면 analyze-roast)'
        required: false
        default: 'analyze-roast'

env:
  SUPABASE_PROJECT_REF: txnpbzukavajwbmggpfk

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 시크릿 확인
        id: gate
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN 시크릿이 없어 배포를 건너뜁니다. \
            저장소 Settings → Secrets → Actions 에서 등록하세요."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Supabase CLI 설치
        if: steps.gate.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Edge Function 배포
        if: steps.gate.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          FN="${{ github.event.inputs.function_name }}"
          FN="${FN:-analyze-roast}"
          echo "배포: $FN → project ${SUPABASE_PROJECT_REF}"
          supabase functions deploy "$FN" \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: 결과 요약
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.ready }}" != "true" ]; then
            echo "### ⏭️ 배포 건너뜀 — SUPABASE_ACCESS_TOKEN 미설정" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. https://supabase.com/dashboard/account/tokens 에서 토큰 발급" >> $GITHUB_STEP_SUMMARY
            echo "2. 저장소 Settings → Secrets and variables → Actions → New repository secret" >> $GITHUB_STEP_SUMMARY
            echo "3. 이름 \`SUPABASE_ACCESS_TOKEN\`, 값에 토큰 붙여넣기" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ analyze-roast 배포 완료" >> $GITHUB_STEP_SUMMARY
          fi
