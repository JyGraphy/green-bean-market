name: 모모스 구조 진단

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/green-bean-update-check-b88h4b
      - name: 의존성
        run: pip install requests beautifulsoup4
      - name: momos 스크래퍼 드라이런 (커밋 없음)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scrapers')
          import scraper_momos as m
          beans = m.scrape()
          print("\n=== 드라이런 결과 ===")
          print("생두 총:", len(beans))
          sold = sum(1 for b in beans if b.get('is_soldout'))
          print(f"품절 {sold} / 재고 {len(beans)-sold}")
          bo = [b for b in beans if 'bolivia' in b['name'].lower() or '볼리비아' in b['name']]
          print(f"볼리비아 {len(bo)}개:")
          for b in bo:
              tag = '품절' if b.get('is_soldout') else '재고'
              print(f"   [{tag}] {b['price']}원 {b['name'][:50]}  {b['url']}")
          print("\n표본 12개:")
          for b in beans[:12]:
              tag = '품절' if b.get('is_soldout') else '재고'
              print(f"   [{tag}] {b['price']}원 {b['name'][:45]}")
          PY
