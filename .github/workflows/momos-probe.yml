name: 모모스 구조 진단

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
      - name: 의존성
        run: pip install requests beautifulsoup4 lxml
      - name: 모모스 스크래퍼 실측 (수집 + 품절 감지)
        run: |
          python3 -c "
          import sys; sys.path.insert(0,'scrapers')
          import scraper_momos as m
          beans=m.scrape()
          sold=sum(1 for b in beans if b['is_soldout'])
          print(f'\n=== 결과: 수집 {len(beans)}개 / 품절 {sold}개 ===')
          for b in beans[:8]:
              print(('품절' if b['is_soldout'] else '판매'), '|', b['name'][:42], '|', b['price'], '|', b['url'])
          "
