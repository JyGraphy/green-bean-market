name: 모모스 구조 진단

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 의존성
        run: pip install requests beautifulsoup4
      - name: 모모스 품절 신호 덤프
        run: |
          python3 - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36','Accept-Language':'ko-KR,ko;q=0.9'}
          BASE='https://momos.co.kr'
          s=requests.Session(); s.headers.update(UA)

          # ── 1) /Product_GreenBean 카드별 품절 신호 분석 ─────────────
          html=s.get(BASE+'/Product_GreenBean', timeout=30).text
          soup=BeautifulSoup(html,'html.parser')
          cards=soup.select('div.shop-item, div._shop_item')
          print("카드 수:", len(cards))
          print("\n### 카드별: 이름 / 가격 / sold_out요소 상태 (전 상품 품절이라는데 구분되나)")
          for i,c in enumerate(cards[:8]):
              h=c.find(['h2','h3']); name=h.get_text(' ',strip=True)[:35] if h else '?'
              pay=c.select_one('p.pay, .item-pay p, .pay'); price=pay.get_text(' ',strip=True) if pay else '?'
              # sold_out 관련 요소 전부
              so=c.select('[class*=sold_out], [class*=soldout], .prod_icon')
              so_desc=[]
              for e in so:
                  style=e.get('style','')
                  txt=e.get_text(' ',strip=True)[:15]
                  so_desc.append(f"{'.'.join(e.get('class',[]))}|style='{style}'|txt='{txt}'")
              # 카드 최상위 class (품절 토글이 여기 있을 수도)
              print(f"[{i}] {name:35s} 가격={price:12s}")
              print(f"     카드class={'.'.join(c.get('class',[]))}")
              for d in so_desc: print(f"     so: {d}")

          # ── 2) 첫 카드 원본 HTML 통째로 ──────────────────────────
          print("\n### 카드[0] 원본 HTML")
          print(str(cards[0])[:2500] if cards else "카드 없음")

          # ── 3) 상세페이지 품절 신호 (idx 2개) ────────────────────
          idxs=re.findall(r'/Product_GreenBean/\?idx=(\d+)', html)[:2]
          print("\n### 상세페이지 품절 신호, idx=", idxs)
          for idx in idxs:
              d=s.get(BASE+f'/Product_GreenBean/?idx={idx}', timeout=30).text
              print(f"\n-- idx={idx} (len {len(d)}) --")
              for kw in ['soldout_yn','sold_out','soldout','품절','SOLD OUT','일시품절','재입고','buy_button','장바구니','구매하기','disabled']:
                  n=d.count(kw)
                  if n:
                      # 첫 등장 주변 문맥
                      p=d.find(kw); ctx=re.sub(r'\s+',' ',d[max(0,p-60):p+60])
                      print(f"   '{kw}' x{n}  …{ctx}…")
          PY
