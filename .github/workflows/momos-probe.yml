name: 모모스 구조 진단

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 의존성
        run: pip install requests beautifulsoup4
      - name: /greenbean 위젯 설정 덤프
        run: |
          python3 - <<'PY'
          import re, json, requests
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36','Accept-Language':'ko-KR,ko;q=0.9'}
          BASE='https://momos.co.kr'; s=requests.Session(); s.headers.update(UA)
          html=s.get(BASE+'/greenbean', timeout=30).text

          # 1) 위젯 컨테이너의 data-* 속성 (imweb 리스트 위젯은 여기에 code/category 를 박는다)
          soup=BeautifulSoup(html,'html.parser')
          print("=== data-widget / data-category 류 속성을 가진 요소 ===")
          seen=set()
          for el in soup.find_all(True):
              attrs={k:v for k,v in el.attrs.items() if any(t in k for t in ['widget','category','menu','shop','prod','list'])}
              if attrs:
                  key=str(sorted(attrs.items()))
                  if key in seen: continue
                  seen.add(key)
                  print(f"  <{el.name} class={el.get('class')}> {json.dumps(attrs, ensure_ascii=False)[:300]}")
              if len(seen)>25: break

          # 2) get_shop_list_view 를 만드는 스크립트 문맥 (넓게)
          print("\n=== get_shop_list_view 스크립트 문맥 (앞400/뒤900) ===")
          for m in re.finditer(r'get_shop_list_view', html):
              a=max(0,m.start()-400); b=m.end()+900
              print(re.sub(r'\s+',' ',html[a:b]))
              print("-"*80)
              break

          # 3) category / widget_code / menu_url 이 함께 나오는 JSON/오브젝트 조각
          print("\n=== category+widget_code 동시 등장 조각 ===")
          for m in list(re.finditer(r'.{0,120}category["\']?\s*[:=].{0,200}', html))[:6]:
              seg=re.sub(r'\s+',' ',m.group(0))
              if 'widget' in seg or 'menu' in seg or 'greenbean' in seg or '생두' in seg:
                  print("  ", seg[:320])
          PY
