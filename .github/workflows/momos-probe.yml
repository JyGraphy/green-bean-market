name: 모모스 구조 진단

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 의존성
        run: pip install requests beautifulsoup4
      - name: 생두 category 찾기
        run: |
          python3 - <<'PY'
          import re, json, requests, collections
          from bs4 import BeautifulSoup
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36','Accept-Language':'ko-KR,ko;q=0.9'}
          BASE='https://momos.co.kr'; s=requests.Session(); s.headers.update(UA)
          html=s.get(BASE+'/greenbean', timeout=30).text

          # PRODUCT_CATEGORY 로 지정된 모든 코드 + 페이지의 모든 s20 카테고리 후보
          cats=[]
          cats += re.findall(r'PRODUCT_CATEGORY\s*=\s*["\']([^"\']+)["\']', html)
          cats += re.findall(r'category=["\']?\+?\s*["\']?(s20\d{6}[0-9a-f]{6,})', html)
          extra=[c for c,_ in collections.Counter(re.findall(r's20\d{6}[0-9a-f]{6,}', html)).most_common(12)]
          seen=set(); order=[]
          for c in cats+extra:
              if c not in seen: seen.add(c); order.append(c)
          print("조회할 category 후보:", order)

          def q(cat):
              r=s.get(BASE+'/ajax/get_shop_list_view.cm', params={'category':cat},
                      headers={'Accept':'application/json','Referer':BASE+'/greenbean'}, timeout=30)
              try: j=r.json()
              except: return None,[]
              doc=BeautifulSoup(j.get('html',''),'html.parser')
              seen=set(); uniq=[]
              for n in doc.select('._shop_item'):
                  raw=n.get('data-product-properties')
                  if not raw: continue
                  try: p=json.loads(raw)
                  except: continue
                  if p.get('code') in seen: continue
                  seen.add(p.get('code')); uniq.append(p)
              return j.get('msg'), uniq

          print("\n=== category별 조회 결과 (생두 카테고리 찾기) ===")
          for cat in order:
              msg,uniq=q(cat)
              names=[p.get('name','')[:38] for p in uniq[:4]]
              bean = sum(1 for p in uniq if '생두' in p.get('name','') or 'Bolivia' in p.get('name','') or 'Los Rodriguez' in p.get('name',''))
              print(f"[{cat}] msg={msg} 고유{len(uniq)}개 생두류{bean}개  예:{names}")
          PY
