name: 리서치 자료 수집 (옥션 · 논문 전문)

# Claude Code 세션은 네트워크 허용목록 정책 때문에 외부 사이트가 403으로 막힌다.
# GitHub Actions 러너는 인터넷이 열려 있으므로 여기서 원본을 받아 커밋한다.
# 이후 AI가 vault/raw/ 의 원본을 읽고 번역·정리한다.

on:
  schedule:
    # 매주 월요일 오전 8시 (KST = UTC+9, 즉 UTC 전날 23:00)
    - cron: '0 23 * * 0'
    # BOP(Best of Panama) 옥션 직후 집중 수집 — 옥션 2026-10-23~25.
    # 10월 26~31일 매일 오전 9시 KST(= UTC 00:00)에 돌려 낙찰 결과 공개를 놓치지 않는다.
    - cron: '0 0 26-31 10 *'
  workflow_dispatch:
    inputs:
      auction_source:
        description: '옥션 소스 (coe / bop / 비우면 전체)'
        required: false
        default: ''
      paper_query:
        description: '논문 검색어 (비우면 대기열만 처리)'
        required: false
        default: ''
      machine:
        description: '로스터기 키 (machines/<키>.md 와 동일). machine_url 과 함께 쓴다'
        required: false
        default: ''
      machine_url:
        description: '받아올 로스터기 자료 주소'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests beautifulsoup4 lxml

      # 사이트 하나가 막혀도 나머지 수집은 계속되도록 격리.
      - name: 옥션 결과 수집 (COE · BOP)
        id: auction
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.auction_source }}" ]; then
            python scripts/auction_fetch.py --source ${{ github.event.inputs.auction_source }}
          else
            python scripts/auction_fetch.py
          fi

      - name: 논문 전문 수집 (오픈액세스)
        id: papers
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.paper_query }}" ]; then
            python scripts/paper_fetch.py --search "${{ github.event.inputs.paper_query }}"
          fi
          python scripts/paper_fetch.py --queue

      # 프로파일 리서치와 같은 자리에서 로스터기 자료도 함께 받는다.
      # 로스팅 AI 학습은 '기기별 판독 규칙'이 핵심이라, 논문만 모아서는 나아지지 않는다.
      - name: 로스터기 자료 수집
        id: machines
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.machine }}" ] && [ -n "${{ github.event.inputs.machine_url }}" ]; then
            python scripts/roast_machine_fetch.py \
              --machine "${{ github.event.inputs.machine }}" \
              --url "${{ github.event.inputs.machine_url }}"
          fi
          python scripts/roast_machine_fetch.py --queue

      # 수집만으로는 AI가 똑똑해지지 않는다 — 기기 규칙을 프롬프트에 주입해야 학습이다.
      # 여기서 supabase/functions/ 가 바뀌면 deploy-functions.yml 이 이어받아 배포한다.
      - name: 로스팅 AI 학습 주입
        id: learn
        continue-on-error: true
        run: python scripts/build_roast_knowledge.py --report

      - name: 세컨드 브레인 목차 갱신
        if: always()
        run: python scripts/build_wiki_index.py

      - name: 변경사항 확인
        id: check_changes
        if: always()
        run: |
          git add vault/raw/ vault/wiki/index.md supabase/
          git diff --cached --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 변경사항 커밋 & 푸시
        if: always() && steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GreenBeanBot"
          git config user.email "bot@green-bean-market"
          git commit -m "리서치 자료 자동 수집: $(date '+%Y-%m-%d')"
          # main 이 앞서 나갔을 때 push 가 거부돼 작업분이 버려지는 것을 막는다
          # (2026-08-20 갱신 잡에서 실제 발생). rebase 후 최대 3회 재시도.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "✅ 푸시 완료 (시도 $i회)"
              exit 0
            fi
            echo "⚠️ 푸시 실패 — 재시도 ($i/3)"
            sleep $((i * 5))
          done
          echo "::error::rebase 후에도 푸시에 실패했습니다."
          exit 1

      # 두 수집이 모두 실패하면 잡을 빨간 X로 표시해 사람이 알아채게 한다.
      - name: 수집 결과 표면화
        if: always()
        run: |
          A="${{ steps.auction.outcome }}"
          P="${{ steps.papers.outcome }}"
          M="${{ steps.machines.outcome }}"
          L="${{ steps.learn.outcome }}"
          echo "옥션: $A / 논문: $P / 로스터기: $M / 학습주입: $L"
          if [ "$A" != "success" ] && [ "$P" != "success" ] && [ "$M" != "success" ]; then
            echo "::error::옥션·논문·로스터기 수집이 모두 실패했습니다 — vault/raw/ 최신 보고서를 확인하세요."
            exit 1
          fi
          if [ "$A" != "success" ]; then echo "::warning::옥션 수집 실패"; fi
          if [ "$P" != "success" ]; then echo "::warning::논문 수집 실패(대기열이 비어 있으면 정상)"; fi
          if [ "$M" != "success" ]; then echo "::warning::로스터기 자료 수집 실패"; fi
          # 학습 주입 실패는 조용히 넘기지 않는다 — 여기가 막히면 아무리 모아도 AI는 그대로다.
          if [ "$L" != "success" ]; then
            echo "::error::로스팅 AI 학습 주입 실패 — 기기 규칙이 프롬프트에 반영되지 않았습니다."
            exit 1
          fi
