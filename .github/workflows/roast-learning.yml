name: 로스팅 AI 자동 학습

# 매주 지금까지 쌓인 모든 자료로 로스팅 AI를 다시 학습시킨다 (누적 학습).
#   ① Boost 신규 로스팅 동기화        scripts/roast_corpus_sync.py  (BOOST_ID/BOOST_PW 없으면 건너뜀)
#   ② 기기·배치별 기준선 재계산        scripts/roast_baselines.py    → data/roast-baselines.json (사이트가 읽음)
#   ③ 정답 있는 사례로 판독 정확도 재측정 scripts/roast_benchmark.py    → data/roast-benchmark-history.json + 리포트
#   ④ 로스팅 판단 두뇌 재학습          scripts/roast_brain.py        → data/roast-brain.json (맛 결과 예측·같은 생두 비교 규칙)
#      학습 정답: Firescope 메모 맛 평가 + 사이트 커핑 기록. 정확도 기준을 넘은 예측만 사이트에 켜진다
#   ⑤ 판독 오차 패턴 → 기기 규칙         scripts/roast_feedback.py     (저장된 프로파일의 사용자 수정 + ③의 정답 비교)
#   ⑥ 규칙을 analyze-roast 프롬프트에 주입 → deploy-functions.yml 이 실서비스에 자동 배포
#
# 학습 자료(사이트 판독 기록·사진·원천 곡선)는 비공개 Supabase 버킷 roast-learning 에 쌓이고,
# 공개 저장소에는 집계값만 커밋한다.
#
# ⚠️ 사전 준비 (한 번만): 저장소 Settings → Secrets and variables → Actions 에
#    SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (필수), BOOST_ID, BOOST_PW (선택) 등록.
#    없으면 해당 단계를 건너뛰고 조용히 종료한다(안전).

on:
  schedule:
    # 매주 화요일 오전 9시 KST (= UTC 월 00:00)
    - cron: '0 0 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '집계만 하고 파일은 수정하지 않음 (true/false)'
        required: false
        default: 'false'
      reanalyze:
        description: '현재 AI 프롬프트로 아직 판독하지 않은 사례를 최대 몇 건 새로 판독할지 (판독 결과는 저장해 재사용 — 프롬프트가 안 바뀐 주는 호출 0건. 0 = 새로 판독 안 함)'
        required: false
        default: '20'

jobs:
  learn:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 학습용 라이브러리 설치
        run: pip install pillow scikit-learn numpy requests

      # ① 새 원천 데이터 — 시크릿이 없으면 건너뛴다. 실패해도 기존 자료로 나머지를 계속한다.
      - name: Boost 신규 로스팅 동기화
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOOST_ID: ${{ secrets.BOOST_ID }}
          BOOST_PW: ${{ secrets.BOOST_PW }}
        run: python scripts/roast_corpus_sync.py

      # ② 누적 기록 전체로 기준선 재계산 → 사이트 피드백 기준이 바뀐다
      - name: 기준선 재계산
        id: baselines
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/roast_baselines.py

      # ③ 정답 있는 사례로 판독 정확도 재측정 (현재 사이트 코드 + 현재 AI 프롬프트)
      - name: 판독 정확도 재측정
        id: benchmark
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/roast_benchmark.py \
            --reanalyze "${{ github.event.inputs.reanalyze || '20' }}" \
            --feedback-out "$RUNNER_TEMP/benchmark_rows.json"

      # ④ 판단 두뇌 재학습 — 쌓인 맛 평가 전체로. 정확도 기준 미달 예측은 내보내지 않는다
      - name: 로스팅 판단 두뇌 재학습
        id: brain
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/roast_brain.py --eval-only
          else
            python scripts/roast_brain.py
          fi

      # ⑤ 실사용 피드백 집계 — 자격증명이 없거나 업로드가 없으면 조용히 통과한다.
      - name: 실사용 피드백 집계 → 기기 규칙 갱신
        id: feedback
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/roast_feedback.py --dry-run --extra "$RUNNER_TEMP/benchmark_rows.json"
          else
            python scripts/roast_feedback.py --extra "$RUNNER_TEMP/benchmark_rows.json"
          fi

      # 갱신된 기기 규칙을 AI 프롬프트에 주입 ← 여기가 '학습'
      - name: AI 프롬프트에 주입
        if: github.event.inputs.dry_run != 'true'
        run: python scripts/build_roast_knowledge.py --report

      - name: 세컨드 브레인 목차 갱신
        if: always()
        run: python scripts/build_wiki_index.py

      - name: 변경사항 확인
        id: check_changes
        if: always()
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry-run — 커밋하지 않음"
            exit 0
          fi
          git add vault/ supabase/ data/roast-baselines.json data/roast-benchmark-history.json \
                  data/roast-brain.json data/roast-brain-history.json
          git diff --cached --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      # 커밋이 supabase/functions/ 를 건드리면 deploy-functions.yml 이 이어받아 배포한다.
      - name: 변경사항 커밋 & 푸시
        if: always() && steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GreenBeanBot"
          git config user.email "bot@green-bean-market"
          git commit -m "로스팅 AI 자동 학습: $(date '+%Y-%m-%d') 기준선·판독 정확도·판단 두뇌·실사용 피드백 반영"
          # main 이 앞서 나갔을 때 push 가 거부돼 작업분이 버려지는 것을 막는다
          # (2026-08-20 갱신 잡에서 실제 발생). rebase 후 최대 3회 재시도.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "✅ 푸시 완료 (시도 $i회)"
              exit 0
            fi
            echo "⚠️ 푸시 실패 — 재시도 ($i/3)"
            sleep $((i * 5))
          done
          echo "::error::rebase 후에도 푸시에 실패했습니다."
          exit 1

      - name: 결과 요약
        if: always()
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "### ⏭️ 자동 학습 건너뜀 — Supabase 자격증명 미설정" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "저장소 Settings → Secrets and variables → Actions 에 아래 두 개를 등록하세요." >> $GITHUB_STEP_SUMMARY
            echo "- \`SUPABASE_URL\` — 예: https://txnpbzukavajwbmggpfk.supabase.co" >> $GITHUB_STEP_SUMMARY
            echo "- \`SUPABASE_SERVICE_ROLE_KEY\` — Supabase 대시보드 → Project Settings → API → service_role" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "### ✅ 학습 반영됨 — 프롬프트 갱신 후 자동 배포가 이어집니다" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ 실행 완료 — 반영할 새 패턴 없음" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.baselines.outcome }}" = "failure" ]; then echo "- ⚠️ 기준선 재계산 실패 (기존 기준선 유지)" >> $GITHUB_STEP_SUMMARY; fi
          if [ "${{ steps.benchmark.outcome }}" = "failure" ]; then echo "- ⚠️ 판독 재측정 실패" >> $GITHUB_STEP_SUMMARY; fi
          if [ "${{ steps.brain.outcome }}" = "failure" ]; then echo "- ⚠️ 판단 두뇌 재학습 실패 (지난 모델 유지)" >> $GITHUB_STEP_SUMMARY; fi
          if [ "${{ steps.feedback.outcome }}" = "failure" ]; then echo "- ⚠️ 피드백 집계 실패" >> $GITHUB_STEP_SUMMARY; fi
          REPORT="vault/raw/roast-profiles/$(date '+%Y-%m-%d')-판독벤치마크.md"
          if [ -f "$REPORT" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            sed -n '/## 📌 결론 3줄/,/^- \*\*조정용/p' "$REPORT" >> $GITHUB_STEP_SUMMARY
          fi
