name: 생두 데이터 자동 갱신

on:
  schedule:
    # 매일 오전 6시 (KST = UTC+9, 즉 UTC 21:00 전날)
    - cron: '0 21 * * *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  scrape:
    runs-on: ubuntu-latest
    # run_all.py 안의 단계별 타임아웃이 1차 방어선이고, 이건 최후의 상한이다.
    # 기본값은 360분이라 파이프라인이 멈춰도 반나절을 붙잡고 있는다.
    # 평소 전체 실행이 16분이므로 60분이면 넉넉하다.
    timeout-minutes: 60
    permissions:
      contents: write  # 커밋 푸시 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install requests beautifulsoup4 lxml

      # 일부 스크래퍼가 실패해도(SystemExit) 정상 수집된 store는 커밋해야 하므로
      # continue-on-error로 잡고, 결과는 마지막 스텝에서 표면화한다.
      - name: 스크래퍼 실행
        id: scrape
        continue-on-error: true
        env:
          # 네이버 공식 오픈API (스마트스토어 폴백용) — 미설정 시 해당 store는 스킵
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scrapers/run_all.py

      # 갱신 결과를 스스로 판정한다. check_links 가 "제거 보류"로 잡아둔 store를
      # 아무도 확인하지 않아 모모스 죽은 링크 115개가 방치됐던 일(2026-08-19)의 재발 방지.
      # 여기서 실패해도 커밋은 진행한다 — 판정은 알림용이지 데이터 차단용이 아니다.
      - name: 사이트 자가 점검
        id: selfcheck
        if: always()
        continue-on-error: true
        run: python scripts/site_selfcheck.py

      # 최종 방어선: 워킹트리를 직전 커밋(HEAD)과 비교해 무결성 검증.
      # 스키마/중복ID/store 소멸/급감 중 하나라도 걸리면 실패 → 아래 커밋이 차단됨.
      - name: 데이터 무결성 검증
        id: validate
        if: always()
        continue-on-error: true
        run: python scripts/validate_data.py

      - name: 변경사항 확인
        id: check_changes
        if: always()
        run: |
          git add -A vault/raw/qa/
          git diff --quiet data/products.json database.sql data/product_dates.json data/update_log.json data/products_web.json data/link_check.json data/process_enrich.json || echo "changed=true" >> $GITHUB_OUTPUT
          git diff --cached --quiet vault/raw/qa/ || echo "changed=true" >> $GITHUB_OUTPUT

      # 커밋은 '검증 통과 + 변경 있음'일 때만. 검증 실패 시 망가진 데이터가 커밋되지 않음.
      - name: 변경사항 커밋 & 푸시
        if: always() && steps.validate.outcome == 'success' && steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GreenBeanBot"
          git config user.email "bot@green-bean-market"
          git add data/products.json database.sql data/product_dates.json data/update_log.json data/products_web.json data/link_check.json data/process_enrich.json vault/raw/qa/
          git commit -m "자동 갱신: $(date '+%Y-%m-%d') 생두 데이터 업데이트"

          # 수집에 15분 남짓 걸리는 동안 다른 작업이 main 을 앞서 나가면 push 가
          # (fetch first) 로 거부되고, 그날 갱신분이 통째로 버려진다.
          # 실제로 2026-08-20 에 이 일이 났다 — 커밋은 만들어졌는데 푸시가 거부됐다.
          # 그래서 rebase 후 재시도한다. 우리 커밋은 데이터 파일만 건드리므로
          # 남의 커밋 위에 얹어도 안전하다.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "✅ 푸시 완료 (시도 $i회)"
              exit 0
            fi
            echo "⚠️ 푸시 실패 — 재시도 ($i/3)"
            sleep $((i * 5))
          done
          echo "::error::rebase 후에도 푸시에 실패했습니다 — 갱신분이 반영되지 않았습니다."
          exit 1

      - name: 변경 없음
        if: always() && steps.validate.outcome == 'success' && steps.check_changes.outputs.changed != 'true'
        run: echo "📦 데이터 변경 없음 — 커밋 스킵"

      # 커밋만으로는 '사용자가 보는 사이트가 멀쩡한지'를 알 수 없다. 배포(Vercel)가
      # 끝날 시간을 준 뒤 실제 라이브 사이트를 찔러본다. 별도 워크플로(sitecheck.yml,
      # 07:15)도 있지만, 갱신과 같은 자리에서 바로 확인해야 원인을 붙여서 볼 수 있다.
      - name: 배포 반영 대기
        if: always() && steps.validate.outcome == 'success' && steps.check_changes.outputs.changed == 'true'
        run: sleep 120

      - name: 라이브 헬스체크
        id: healthcheck
        if: always() && steps.validate.outcome == 'success'
        continue-on-error: true
        run: python scripts/healthcheck.py https://green-bean-market.vercel.app

      # 검증 실패 → 커밋하지 않고 잡을 실패로 표시 (배포된 데이터는 그대로 유지)
      - name: 검증 실패 표면화
        if: always() && steps.validate.outcome == 'failure'
        run: |
          echo "❌ 데이터 무결성 검증 실패 — 커밋하지 않았습니다. 위 '데이터 무결성 검증' 로그를 확인하세요."
          echo "의도적 대량 변경이면 FORCE_DATA_UPDATE=1 환경변수로 수동 실행하세요."
          exit 1

      # 검증은 통과했지만 일부 스크래퍼가 실패한 경우: 정상 데이터는 커밋된 뒤 알림용 실패 표시
      - name: 스크래퍼 부분 실패 표면화
        if: always() && steps.validate.outcome == 'success' && steps.scrape.outcome == 'failure'
        run: |
          echo "⚠️ 일부 스크래퍼가 실패했습니다. 위 '스크래퍼 실행' 로그에서 실패한 사이트를 확인하세요."
          echo "실패한 사이트의 기존 데이터는 보존되었으며, 성공한 사이트는 정상 갱신·커밋되었습니다."
          exit 1

      # 링크가 통째로 깨진 공급사가 있으면 여기서 빨간 X → 알림 메일.
      # 데이터는 이미 커밋됐고, 이건 '사람이 고쳐야 할 일이 생겼다'는 신호다.
      - name: 사이트 문제 표면화
        if: always() && steps.selfcheck.outcome == 'failure'
        run: |
          echo "❌ 조치가 필요한 사이트 문제가 있습니다 — 위 '사이트 자가 점검' 요약을 확인하세요."
          echo "보고서: vault/raw/qa/<날짜>-사이트점검.md"
          echo "조치: Actions → 공급사 링크 진단 → 해당 공급사로 Run workflow"
          exit 1

      - name: 라이브 사이트 이상 표면화
        if: always() && steps.healthcheck.outcome == 'failure'
        run: |
          echo "❌ 라이브 사이트 점검 실패 — 위 '라이브 헬스체크' 로그를 확인하세요."
          echo "정적 페이지·상품수·링크 형식·Supabase 백엔드 중 하나에 문제가 있습니다."
          exit 1
