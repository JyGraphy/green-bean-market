<text x="561.3" y="304" text-anchor="middle" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11.5" font-weight="700" fill="#7c3aed">마라고지페 · 파카마라</text>
<text x="561.3" y="289" text-anchor="middle" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="10" fill="#8a9096">"코끼리콩" — 눈으로 구별되는 몇 안 되는 품종</text>
<path d="M 56.0 317 V 310 H 160.4 V 317" fill="none" stroke="#b45309" stroke-width="1.6"/>
<text x="108.2" y="304" text-anchor="middle" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11.5" font-weight="700" fill="#b45309">모카 · 라우리나 등 소립종</text>
<text x="24" y="362" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="10.8" fill="#5b6166">스크린 = 체의 구멍 크기를 1/64 인치 단위로 센 번호. 위 원의 지름은 추정이 아니라 N × 25.4/64 mm 를 그대로 축척한 값이다.</text>
<text x="24" y="381" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="10.8" fill="#5b6166">크기는 품질이 아니라 열이 들어가는 속도의 변수다 — 한 배치에 크기가 섞이면 작은 콩이 먼저 타고 큰 콩은 아직 1차 크랙 전이다.</text>
<text x="24" y="400" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="10.8" fill="#5b6166">품종별 스크린 범위(마라고지페 19+ 등)는 업계 통용값이며 1차 자료로 확인하지 못했다. 스크린–mm 환산만 계산값이다.</text>
