<text x="26" y="56" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="12.5"
      fill="#6b7280">사진은 축척이 없어 크기 비교에 못 쓴다. 체 번호에서 지름을 계산해 실제 비율로 그렸다.</text>
