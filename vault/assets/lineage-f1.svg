<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="100%">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#9aa3aa"/>
  </marker>
</defs>
<rect width="1120" height="500" fill="#ffffff"/>
<text x="26" y="34" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="23" font-weight="800"
      fill="#17202a">⑤ 계보도 4 — F1 하이브리드와 케냐 복합 육종</text>
<text x="26" y="56" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="12.5"
      fill="#6b7280">지금 육종의 주류. 저항성 계열과 야생 다양성을 다시 교배해 수확량과 품질을 같이 잡으려는 시도.</text>
<text x="580" y="420" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11.5" fill="#5b6166">F1 = 유전적으로 먼 두 부모의 1세대. 잡종강세로 수확량·기후 적응폭·내병성이 한꺼번에 올라간다.</text>
<text x="580" y="440" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11.5" fill="#5b6166">육종 기간도 순계 25~30년 → 10~20년으로 짧다. 난점은 번식이었고, 스타마야가 그것을 풀었다.</text>
<rect x="20" y="464" width="15" height="15" rx="3" fill="#fcebf2" stroke="#be185d" stroke-width="1.6"/>
<text x="41" y="476" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11.5" fill="#4a5258">이입 계열</text>
<rect x="202" y="464" width="15" height="15" rx="3" fill="#eef0f2" stroke="#4b5563" stroke-width="1.6"/>
<text x="223" y="476" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11.5" fill="#4a5258">야생 수단</text>
