<text x="592" y="150" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">왜성·다수확·내병성</text>
<text x="592" y="167" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">부계에 K7 · SL28 · 루메 수단</text>
