<text x="312" y="143" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="13" font-weight="700" fill="#17202a">센트로아메리카노 (H1)</text>
<text x="312" y="160" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">사치모르 T5296 × 루메 수단</text>
<text x="312" y="177" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">수확량·품질 모두 높다</text>
<text x="312" y="194" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">뿌리가 얕아 바람·가뭄에 약함</text>
<rect x="300" y="330" width="258" height="77" rx="5" fill="#e6f5f3" stroke="#0d9488" stroke-width="1.6"/>
<rect x="300" y="330" width="4" height="77" rx="2" fill="#0d9488"/>
<text x="312" y="353" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="13" font-weight="700" fill="#17202a">스타마야 Starmaya</text>
<text x="312" y="370" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">웅성불임 모계 × 마르셀레사</text>
<text x="312" y="387" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">씨앗으로 대량 보급 가능한 첫 F1</text>
<rect x="580" y="110" width="258" height="77" rx="5" fill="#e8f2f9" stroke="#0369a1" stroke-width="1.6"/>
<rect x="580" y="110" width="4" height="77" rx="2" fill="#0369a1"/>
