<text x="30" y="120" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">티모르 하이브리드 × 비야사치</text>
<text x="30" y="137" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">→ 녹병 저항성 담당</text>
