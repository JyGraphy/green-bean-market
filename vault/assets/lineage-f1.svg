<text x="30" y="350" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">사치모르 계열 순계</text>
<rect x="18" y="390" width="258" height="60" rx="5" fill="#e6f5f3" stroke="#0d9488" stroke-width="1.6"/>
