<text x="30" y="213" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="13" font-weight="700" fill="#17202a">루메 수단 Rume Sudan</text>
<text x="30" y="230" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">1941년 남수단 보마고원 야생 채집</text>
<text x="30" y="247" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">좁은 아라비카 풀의 희귀한 외부 다양성</text>
<rect x="18" y="310" width="258" height="60" rx="5" fill="#fcebf2" stroke="#be185d" stroke-width="1.6"/>
<rect x="18" y="310" width="4" height="60" rx="2" fill="#be185d"/>
