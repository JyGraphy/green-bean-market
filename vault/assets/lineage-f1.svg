<text x="30" y="430" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">씨앗 번식을 가능하게 한 열쇠</text>
<rect x="300" y="120" width="258" height="94" rx="5" fill="#e6f5f3" stroke="#0d9488" stroke-width="1.6"/>
