<text x="227" y="173" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="13" font-weight="700" fill="#17202a">티피카 Typica</text>
<text x="227" y="190" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">예멘→인도→자바(1699)</text>
<text x="227" y="207" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">→암스테르담(1706)→파리(1714)</text>
<text x="227" y="224" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">→마르티니크(1723)→중남미</text>
<rect x="215" y="300" width="222" height="94" rx="5" fill="#fbf0e3" stroke="#b45309" stroke-width="1.6"/>
<rect x="215" y="300" width="4" height="94" rx="2" fill="#b45309"/>
<text x="227" y="323" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="13" font-weight="700" fill="#17202a">부르봉 Bourbon</text>
<text x="227" y="340" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">예멘→부르봉섬(레위니옹)</text>
<text x="227" y="357" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">1708·1715·1718 세 번 시도</text>
<text x="227" y="374" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">→19세기 중반 브라질로</text>
<rect x="440" y="96" width="222" height="60" rx="5" fill="#e9eefb" stroke="#1d4ed8" stroke-width="1.6"/>
