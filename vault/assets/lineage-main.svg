<text x="452" y="119" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="13" font-weight="700" fill="#17202a">마라고지페 (1800년대·브라질)</text>
<text x="452" y="136" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">티피카 변이 — 생두가 가장 크다</text>
