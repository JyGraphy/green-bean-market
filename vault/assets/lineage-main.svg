<text x="26" y="34" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="23" font-weight="800"
      fill="#17202a">③ 계보도 2 — 예멘을 거친 두 계통과 그 자손</text>
<text x="26" y="56" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="12.5"
      fill="#6b7280">현대 재배 품종의 거의 전부가 여기 있다. 돌연변이는 한 나무에서 저절로 생긴 변종, 교잡은 두 품종을 교배한 것.</text>
