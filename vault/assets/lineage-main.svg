<text x="452" y="208" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">티피카 변이 — 왜성</text>
<rect x="440" y="240" width="222" height="77" rx="5" fill="#fbf0e3" stroke="#b45309" stroke-width="1.6"/>
