<text x="956" y="460" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">부르봉 계열로 판정 · 케냐 컵의 원형</text>
<text x="956" y="477" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">내건성↑ 수확량↓ 내병성↓</text>
<rect x="944" y="516" width="222" height="77" rx="5" fill="#e8f2f9" stroke="#0369a1" stroke-width="1.6"/>
<rect x="944" y="516" width="4" height="77" rx="2" fill="#0369a1"/>
<text x="956" y="539" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="13" font-weight="700" fill="#17202a">SL34 (1930년대·케냐)</text>
<text x="956" y="556" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">"프렌치미션" 라벨 탓에 부르봉으로 오해</text>
<text x="956" y="573" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">유전자는 티피카 계열</text>
