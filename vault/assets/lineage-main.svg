<text x="452" y="369" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">부르봉 변이 — 왜성</text>
<rect x="440" y="401" width="222" height="60" rx="5" fill="#fbf0e3" stroke="#b45309" stroke-width="1.6"/>
