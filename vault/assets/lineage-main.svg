<text x="452" y="441" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">부르봉 변이 — 왜성</text>
<rect x="440" y="473" width="222" height="60" rx="5" fill="#fbf0e3" stroke="#b45309" stroke-width="1.6"/>
<rect x="440" y="473" width="4" height="60" rx="2" fill="#b45309"/>
<text x="452" y="496" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="13" font-weight="700" fill="#17202a">라우리나 / 부르봉 포인투</text>
<text x="452" y="513" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">레위니옹 변이 — 카페인 약 절반</text>
