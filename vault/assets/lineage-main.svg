<text x="452" y="280" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">부르봉 변이 — 왜성</text>
<text x="452" y="297" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">밀식이 가능해졌다 = 산업이 바뀜</text>
