<text x="30" y="290" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">15~16세기 전파</text>
<text x="30" y="307" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">여기서 소수만 밖으로</text>
