<text x="704" y="352" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">파카스 × 마라고지페</text>
<text x="704" y="369" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">생두가 크고 향미가 튄다</text>
