<text x="704" y="160" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">티피카 × 부르봉 자연 교잡</text>
<text x="704" y="177" font-family='"Noto Sans KR","NanumGothic",sans-serif' font-size="11" fill="#4a5258">키 크고 수확량 많다</text>
